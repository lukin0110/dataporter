<!doctype html>
<!-- A stand-in for claude.ai/chat/<uuid>: two turns behind a composer holding
     eleven characters, and an enabled Send button. The last turn is the
     assistant's, which is what `08`'s `await-response` waits for. -->
<meta charset="utf-8">
<title>Migrated conversation</title>
<main>
  <div data-testid="conversation">
    <div data-testid="user-message">Hello there</div>
    <div data-testid="assistant-message">ACK part 1 of 1 — General Kenobi</div>
  </div>
  <div contenteditable="true" role="textbox" aria-label="Write your prompt">ACK part 1</div>
  <button aria-label="Send message">Send</button>
</main>
