<!doctype html>
<!-- A stand-in for the panel where claude.ai lets a user ask for their data.

     Since `51` its shape is the observed one (2026-09-14): a settings panel
     marked `data-perf-screen`, rows marked `data-settings-row`, and the Export
     control as the first row of the panel that holds a button — every row above
     it holds a switch. That shape is the whole of what
     `EXPORT_BUTTON_SELECTOR` has to go on, because the rows carry no test id
     and their React ids are regenerated on every render, so the fixture models
     it exactly: a switch row first, then Export, then a *Manage* row under it
     that must not be the one a click finds.

     The second stage is observed too: the row opens a second screen inside the
     same dialog, whose `Export` button carries a real test id. What is still
     `*unknown*` is only the last one — what the panel shows once the request is
     accepted — so that stage is built from the selector as it stands and is
     evidence about us rather than about claude.ai: that `click_js` clicks the
     first *visible* match, and that `EXPORT_PAGE_JS` tells the stages apart in
     a real Chrome.

     Deliberately not modelled: the real panel is itself a `[role="dialog"]`, so
     on claude.ai `view.dialog` is true before anything is clicked. This file
     leaves that out because it is testing the three-stage mechanics, and a
     fixture whose dialog is open from the start cannot show them. -->
<meta charset="utf-8">
<title>Data privacy controls</title>
<style>
  [hidden] { display: none; }
  .invisible { display: none; }
  /* As claude.ai clips its screen-reader regions: 1×1 and clipped, not hidden,
     so anything asking whether it is *visible* is told yes. */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
<main>
  <h1>Data privacy controls</h1>

  <!-- The live regions the real site carries all along. `31`'s
       `REQUESTED_SELECTOR` had `[role="status"]` as a fallback, one of these
       matched it before anything had been asked for, and the ask reported an
       export nobody had requested. They are here so that a selector generous
       enough to do that again fails the three-stage test instead. -->
  <div role="status" aria-live="polite" class="sr-only"></div>
  <div role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <div data-perf-overlay="settings_modal" data-perf-screen="data-privacy-controls">
    <section>
      <h3>Preferences</h3>
      <!-- A row above Export that holds no button. The selector's whole claim is
           that the Export button is the panel's first, so a row that would break
           it if it were matched belongs here. -->
      <div role="group" data-settings-row>
        <span class="settings-row-title">Help improve our AI models</span>
        <span role="switch" data-cds="Switch" aria-checked="false"></span>
      </div>
    </section>

    <section>
      <h3>Your data</h3>
      <!-- A hidden button matching the same selector, first in document order:
           the click helper filters by visibility, and a panel that offers one
           control per device width is exactly how a real one would break that
           rule. -->
      <div role="group" data-settings-row class="invisible">
        <span class="settings-row-title">Export data</span>
        <button type="button" data-cds="Button">Export data</button>
      </div>
      <div role="group" data-settings-row>
        <span class="settings-row-title">Export data</span>
        <button type="button" data-cds="Button">Export data</button>
      </div>
      <!-- Under it, the row a mis-aimed click would find instead. -->
      <div role="group" data-settings-row>
        <span class="settings-row-title">Shared chats</span>
        <button type="button" data-cds="Button" id="manage">Manage</button>
      </div>
    </section>
  </div>

  <!-- The second screen. On claude.ai this replaces the rows above inside the
       same settings dialog rather than opening over them, and it carries a
       period control and a list of what the export will include; what the ask
       needs from it is the one button, whose test id is the observed one. -->
  <div role="dialog" aria-label="Export data" hidden>
    <p>A download link will be sent to your email. Link expires in 24 hours.</p>
    <button type="button" data-cds="Button" data-testid="export-confirm-button">Export</button>
  </div>

  <!-- The accepted signal, as claude.ai raises it (*observed 2026-09-15*): a
       toast with no test id in it, one `[role="dialog"]` per notification and
       the words in an `h2`. The decoy above it is the point of the fixture —
       it is a toast of exactly the same shape saying something else, so a
       selector that matched the furniture rather than the words would read
       "requested" on a page where nothing has been asked for, which is the
       failure of 2026-09-14 in new markup. -->
  <div data-cds="Toast" class="fixed">
    <div role="status" class="sr-only" aria-hidden="true"></div>
    <div role="region" aria-live="polite" aria-label="Notifications">
      <div data-type="neutral" role="dialog" aria-modal="false" id="decoy-toast">
        <div><h2 data-type="neutral" class="font-medium">Link copied</h2></div>
      </div>
      <div data-type="neutral" role="dialog" aria-modal="false" id="export-started" hidden>
        <div><h2 data-type="neutral" class="font-medium">Export started</h2></div>
      </div>
    </div>
  </div>
</main>
<script>
  const dialog = document.querySelector('[role="dialog"][aria-label="Export data"]');
  const requested = document.getElementById('export-started');
  const panel = document.querySelector('[data-perf-screen="data-privacy-controls"]');

  for (const button of panel.querySelectorAll('[data-settings-row] button[data-cds="Button"]')) {
    if (button.id === 'manage') continue;
    button.addEventListener('click', () => { dialog.hidden = false; });
  }
  document
    .querySelector('[data-testid="export-confirm-button"]')
    .addEventListener('click', () => {
      dialog.hidden = true;
      requested.hidden = false;
    });
</script>
