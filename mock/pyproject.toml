[project]
name = "mocks"
version = "0.2.0"
description = "Served stand-ins for claude.ai and chatgpt.com, for rehearsing a migration against."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "lukin0110" }]
# `cryptography` is here for one reason: Chrome will not speak TLS to a host it
# cannot verify, and nothing in the standard library can mint a certificate.
# The wire is FastAPI served by uvicorn — `python-multipart` is what FastAPI
# reads a sign-in form with — and the pages and the state are stdlib.
dependencies = [
    "cryptography>=42",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

# One command per site (brief `05` §53, ADR 0007). The distribution was
# `claude-mock` until `38` added the core and the second site; the commands kept
# their names.
[project.scripts]
claude-mock = "claudemock.cli:main"
chatgpt-mock = "chatgptmock.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The core the sites share, and a package per site. Each site imports the core
# and nothing of the other site's.
[tool.hatch.build.targets.wheel]
packages = ["src/mockcore", "src/claudemock", "src/chatgptmock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
