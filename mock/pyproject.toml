[project]
name = "claude-mock"
version = "0.1.0"
description = "A served stand-in for claude.ai, for rehearsing a migration against."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "lukin0110" }]
# `cryptography` is here for one reason: Chrome will not speak TLS to a host it
# cannot verify, and nothing in the standard library can mint a certificate.
# The wire is FastAPI served by uvicorn — `python-multipart` is what FastAPI
# reads a sign-in form with — and the pages and the state are stdlib.
dependencies = [
    "cryptography>=42",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
claude-mock = "claudemock.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudemock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
