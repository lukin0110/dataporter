[project]
name = "dataporter"
# The version is `dataporter.__version__` and nowhere else (`[tool.hatch.version]`
# below reads it): `--version` prints that string, a caller reads it off the
# module, and the wheel's metadata is built from the same line, so the three
# cannot drift.
dynamic = ["version"]
description = "Migrate a Claude data export into another Claude account via Hermes."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639: an SPDX expression plus the files it refers to. No `License ::`
# classifier beside it — the classifiers were deprecated by that PEP and
# declaring both is what a modern backend rejects, so adding one back would look
# like an improvement and break the build.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lukin0110" }]
keywords = ["claude", "hermes", "migration", "browser-automation", "data-export"]
classifiers = [
    # Alpha because `21`'s full run has not happened: the tool is built and
    # tested, and the experiment it exists to run has not produced its number.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    # Claimed by `src/dataporter/py.typed`, and true only while it ships.
    "Typing :: Typed",
]
dependencies = [
    "orval>=0.0.12",
    "pydantic>=2",
    "pydantic-settings>=2",
    # `13`'s retry loop, and nothing else: `Importer._migrate` builds one
    # `Retrying` per conversation whose `retry`/`stop`/`wait` read our own
    # cumulative `attempts` minus the deferrals `14` and `15` spared, so the
    # library owns the shape of the loop and none of its arithmetic. `sleep=` is
    # passed `pause`, which is what keeps every wait behind the one seam the
    # tests record. >=9 is the line this was verified against; it has no
    # dependencies of its own.
    "tenacity>=9",
    # >=0.27 specifically: `typer.TyperException` (the base of the vendored click
    # exception hierarchy, which cli.py's exit-70 guard catches) does not exist in
    # 0.26 or earlier, where typer still depends on real click. Verified against
    # 0.20, 0.21, 0.23 and 0.26.
    "typer>=0.27",
    # Declared here, first used in 07 for a synchronous CDP client
    # (websockets.sync.client). No asyncio anywhere.
    "websockets>=12",
]

[project.optional-dependencies]
# 20's semantic-fidelity judge, and nothing else. Not installed by `uv sync`, not
# installed in CI, and imported dynamically by `dataporter/judge.py` so that a
# build without it type-checks: the judge is an experiment's instrument, and a
# migration never asks a model anything.
judge = ["pydantic-ai"]

[project.scripts]
dataporter = "dataporter.cli:app"

[project.urls]
Homepage = "https://github.com/lukin0110/dataporter"
Repository = "https://github.com/lukin0110/dataporter"
Issues = "https://github.com/lukin0110/dataporter/issues"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    # `22`'s last item, spent by `make test-all` as `-n auto`. The full suite is
    # subprocess- and socket-bound, so it divides by the core count; nothing else
    # in the lock needs it, and `make check` does not use it.
    "pytest-xdist",
]

[build-system]
# >=1.27 specifically: PEP 639's `license` expression and `license-files` are
# read by that version and ignored (or rejected) by earlier ones. The build
# backend is not a locked dependency, so this floor is the only thing that says
# it — `uv.lock` will not notice a stale hatchling.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The single source, read by regex from the module that defines it.
path = "src/dataporter/__init__.py"

[tool.hatch.build.targets.wheel]
# Everything under the package directory, which is what puts `py.typed` and
# `skills/claude-migrate/SKILL.md` in the wheel. `25`'s packaging test asserts
# both are there, because `hermes.skill.packaged_dir` reads the second out of the
# install and a wheel missing it fails at `setup` on somebody else's machine.
packages = ["src/dataporter"]

[tool.hatch.build.targets.sdist]
# 10 adds spikes/; it is never part of the distribution. `.claude`, `.agents` and
# `graft` are the coding agents' scaffolding (`25`) — development tooling that no
# consumer of the source distribution needs. `tests` is deliberately *not*
# excluded: an sdist somebody can run `make check` against is worth more than a
# smaller one.
exclude = [
    "spikes",
    "specs",
    "docs",
    # `26` and `29`: the mock is its own project and the rehearsal is a
    # developer's instrument. Neither is part of what a consumer installs, and
    # `rehearsal` imports the test tree, which a wheel does not carry.
    "mock",
    "rehearsal",
    ".claude",
    ".agents",
    ".mcp.json",
    "skills-lock.json",
    "graft",
]

[tool.uv.workspace]
# `26`'s mock is a member rather than a directory: it has its own dependencies
# (FastAPI and uvicorn for the wire, `cryptography` to mint a TLS certificate),
# its own tests and its own README, and it imports nothing from `dataporter`.
# Moving it to its own repository is a directory move — ADR 0003 — and this line
# is the only thing that would have to go with it.
members = ["mock"]

[tool.ruff]  # https://github.com/lukin0110/uv-copier/blob/main/template/pyproject.toml.jinja
fix = true
line-length = 120
src = ["src", "tests"]
# `py312`, not the template's `py313`: `requires-python` is `>=3.12`, and `UP`
# rewriting to syntax 3.12 does not have would break the floor the classifiers claim.
target-version = "py312"
force-exclude = true  # https://docs.astral.sh/ruff/settings/#force-exclude
preview = true  # https://docs.astral.sh/ruff/preview/
# The specs are normative prose. ruff formats Python blocks inside Markdown, which
# would rewrite them; they are documents, not code.
extend-exclude = ["specs", "docs"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ASYNC", "B", "BLE", "C4", "C90", "D", "DTZ", "E", "EM", "ERA", "F",
    "FBT", "FLY", "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N", "NPY",
    "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "RET",
    "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TCH", "TID", "TRY", "UP",
    "W", "YTT",
]
# `ANN` is this project's own addition to the template's set: it replaces the one
# thing `mypy --strict` enforced that ty does not, which is that every def is
# annotated. Everything else above is the template's list, verbatim.
ignore = [
    # The template's list, verbatim.
    "D10", "D203", "D213", "E501", "EM101", "EM102", "FBT001", "ISC001", "RET504",
    "RUF201", "S101", "TRY003", "TRY300", "W505",
    # This project's, each with the reason it is here.
    # ANN401 is stricter than mypy --strict ever was; the export parser genuinely
    # reads `Any` off untrusted JSON.
    "ANN401",
    # A Typer command's options are its parameters — `import` has sixteen — and a
    # pytest test's fixtures are its parameters too. Neither count is a design smell,
    # and neither is fixable without making the code worse. The rules that measure
    # what a function *does* (C901, PLR0911, PLR0912, PLR0914, PLR0915) stay on.
    "PLR0904", "PLR0913", "PLR0917",
    # An implementation of a Protocol or of a base class is a method whether or not
    # this particular one needs `self`: `console.Sink`, `progress.Progress` and
    # `intervention.Intervention` are all satisfied by shape.
    "PLR6301",
    # `dataporter/__init__.py` is where `__version__` and `PROGRAM_NAME` live, and
    # `[tool.hatch.version]` reads the first of them out of that file by regex.
    "RUF067",
    # Importing `subprocess` is what a tool that drives Hermes and Chrome does. The
    # calls themselves are still checked (S602, S603, S607).
    "S404",
]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]  # https://docs.astral.sh/ruff/settings/#unfixable
# En dash, minus sign and multiplication sign are typography in this project's prose
# (`12`–`14`, `total − done`, `done / total × 20`), not homoglyphs.
allowed-confusables = ["–", "−", "×"]

[tool.ruff.lint.extend-per-file-ignores]  # https://docs.astral.sh/ruff/settings/#extend-per-file-ignores
# Ignore missing __init__.py files in tests.
"tests/*" = [
    "INP001",
    "PLR2004",
    # The suite asserts configured values — `30.0`, `0.5` — never the result of
    # arithmetic, so an exact comparison is the assertion being made.
    "RUF069",
    # Fixture credentials and `/tmp` paths are what a test of a credential or a path
    # is made of.
    "S105", "S106", "S108",
    # Every subprocess a test starts is one of our own commands, with argv it built.
    "S603",
    # A test reaches into what it is testing; that is the difference between a test
    # and a caller.
    "SLF001",
]
# `26`'s mock is a served stand-in for claude.ai: its CLI prints, its fixtures carry
# passwords, and its tests are a directory rather than a package.
"mock/*" = ["INP001", "PLR2004", "S105", "S106", "S310", "T201"]
# `10`'s spikes and `29`'s rehearsal are instruments a person runs and reads: what
# they print is their output, and the processes they start are our own commands.
"spikes/*" = ["INP001", "PLR2004", "S603", "T201"]
"rehearsal/*" = ["INP001", "PLR2004", "S105", "S603", "T201"]
# The one place the tool writes to stdout (`23`), and the one place it asks the
# person at the keyboard a question (`14`). Everything else routes through them.
"src/dataporter/console.py" = ["T201"]
"src/dataporter/intervention.py" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `@validator` decorator to trigger class method treatment.
classmethod-decorators = ["classmethod", "pydantic.validator", "pydantic.root_validator"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]  # https://docs.astral.sh/ty/configuration/
python-version = "3.12"
# Four of these five are not shipped (see the sdist exclude above) and are all
# checked. `./spikes`: `10`'s scripts import `dataporter`, and a throwaway script
# that no longer imports is a throwaway script nobody can re-run after the next UI
# change. `./mock/src`: `26`'s mock is its own project and its own type-checked
# code. `./tests` and `.`: `29`'s `rehearsal` package imports both the tool and
# the scripted agent's procedures, which live in the test tree.
root = ["./src", "./spikes", "./mock/src", "./tests", "."]

[tool.ty.terminal]
output-format = "github"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so that `rehearsal` imports. `29`'s package is not part of
# the wheel and is not on the installed path; `tests/` is already importable
# because pytest inserts it (there is no `__init__.py` there), and this is the
# same courtesy for the one other directory the suite reads.
pythonpath = ["."]
# The fast half, by default. Anything that spawns a subprocess, binds a socket or
# launches a browser is marked `slow` and deselected here, which is what makes a
# bare `pytest` the inner-loop command: ~870 tests in about 3 seconds against
# ~1350 in about 64 — and in about 22 as `make test-all` runs them, across four
# cores. `make check-all` runs everything and is the only command that measures
# coverage — a percentage over half the suite is a number no gate could use.
#
# The two halves were four minutes apart when `15` split them and are one minute
# apart now: `22` took the fixed tax out of the slow half rather than leaving it
# hidden behind the marker, so the split is a safety rail (a pull request is
# never gated on a browser) rather than the thing that makes the loop bearable.
#
# The list form rather than a string: pytest `shlex.split`s a string, so the
# quoting in `-m 'not slow'` is a question the list form does not raise.
#
# One consequence to know: `-m` applies to node ids too, so
# `pytest tests/test_browser_cdp.py::test_version_and_browser_id` reports
# `1 deselected` and exits 0. Run a slow test by name with `make test-all` or
# `pytest -m "slow or not slow" <node id>`.
addopts = ["-m", "not slow", "--strict-markers", "--strict-config"]
markers = [
    "slow: spawns a subprocess, binds a socket, or launches a browser.",
    "live: drives a real Chrome; also `slow`. Skipped where none is installed.",
]

[tool.coverage.run]
source = ["src/dataporter"]

[tool.coverage.report]
# Measured by `make check-all`, which is the only command that passes `--cov` —
# so these numbers are reproducible by that command and not by `make check`.
# The suite's coverage at the time this gate was added: 1385/1409 statements,
# 98.3%. Raise it when the real number rises; never lower it to make a run pass.
# `09`: 3423/3450, 99.2%. `11`: 3497/3524, 99.2%. `12`: 3768/3795, 99.3%.
# `13`: 3858/3885, 99.3%. `14`: 4081/4108, 99.3%. `15`: 4223/4250, 99.4%.
# `17`: 4642/4669, 99.4%. `18`: 4782/4810, 99.4%. `19`: 4959/4986, 99.5%.
# `20`: 5348/5382, 99.4%. `21`: 5362/5390, 99.5% — it adds no `src` code,
# and the sign-off script it does add lives in `spikes/`, which is not measured.
# `23`: 5571/5599, 99.5%. `24`: 5897/5925, 99.5%. `25`: 5901/5929, 99.5% — the
# only code it adds is `__main__.py`, whose `if __name__` guard is excluded below
# because it runs in a subprocess. `26`-`29`: 5951/5984, 99.45% — M7 adds no
# module to this package at all, only the three fixes its first rehearsal found
# (`browser/session.py`, `browser/login_form.py`, `verify.py`). `mock/` and
# `rehearsal/` are not measured here and are not meant to be: the mock has its
# own suite (`make test-mock`) and the rehearsal is measured by running it.
# `30`: 6463/6495, 99.51% — `store.py` and `extract.py` are both at 100%, which
# is what a module that writes files once and never again has to be.
fail_under = 99
show_missing = true
# `python -m dataporter`'s guard runs in a subprocess, where coverage does not
# follow it. Excluding the line is honest; lowering the gate to accommodate one
# uncoverable statement would not be. `25`'s packaging test is what proves the
# module works.
exclude_also = ['if __name__ == "__main__":']
