[project]
name = "dataporter"
version = "0.1.0"
description = "Migrate a Claude data export into another Claude account via Hermes."
# readme: 21 writes README.md and adds the key.
requires-python = ">=3.12"
dependencies = [
    "orval>=0.0.11",
    "pydantic>=2",
    "pydantic-settings>=2",
    # >=0.27 specifically: `typer.TyperException` (the base of the vendored click
    # exception hierarchy, which cli.py's exit-70 guard catches) does not exist in
    # 0.26 or earlier, where typer still depends on real click. Verified against
    # 0.20, 0.21, 0.23 and 0.26.
    "typer>=0.27",
    # Declared here, first used in 07 for a synchronous CDP client
    # (websockets.sync.client). No asyncio anywhere.
    "websockets>=12",
]

[project.optional-dependencies]
# 20's semantic-fidelity judge, and nothing else. Not installed by `uv sync`, not
# installed in CI, and imported dynamically by `dataporter/judge.py` so that a
# build without it type-checks: the judge is an experiment's instrument, and a
# migration never asks a model anything.
judge = ["pydantic-ai"]

[project.scripts]
hermes-claude-migrate = "dataporter.cli:app"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataporter"]

[tool.hatch.build.targets.sdist]
# 10 adds spikes/; it is never part of the distribution.
exclude = ["spikes", "specs", "docs"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# The specs are normative prose. ruff formats Python blocks inside Markdown, which
# would rewrite them; they are documents, not code.
extend-exclude = ["specs", "docs"]

[tool.ruff.lint]
# ANN replaces the one thing `mypy --strict` enforced that ty does not: every def
# annotated. ANN401 (no explicit `Any`) is stricter than mypy --strict ever was;
# the export parser genuinely reads `Any` off untrusted JSON.
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ty.environment]  # https://docs.astral.sh/ty/configuration/
python-version = "3.12"
# `./spikes` is not shipped (see the sdist exclude above) but is checked: `10`'s
# scripts import `dataporter`, and a throwaway script that no longer imports is a
# throwaway script nobody can re-run after the next UI change.
root = ["./src", "./spikes"]

[tool.ty.terminal]
output-format = "github"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fast half, by default. Anything that spawns a subprocess, binds a socket or
# launches a browser is marked `slow` and deselected here, which is what makes a
# bare `pytest` the inner-loop command: ~640 tests in about 3 seconds against
# ~1100 in about 310. `make check-all` runs everything and is the only command
# that measures coverage — a percentage over half the suite is a number no gate
# could use. `22` is the slice that makes the other half quick.
#
# The list form rather than a string: pytest `shlex.split`s a string, so the
# quoting in `-m 'not slow'` is a question the list form does not raise.
#
# One consequence to know: `-m` applies to node ids too, so
# `pytest tests/test_browser_cdp.py::test_version_and_browser_id` reports
# `1 deselected` and exits 0. Run a slow test by name with `make test-all` or
# `pytest -m "slow or not slow" <node id>`.
addopts = ["-m", "not slow", "--strict-markers", "--strict-config"]
markers = [
    "slow: spawns a subprocess, binds a socket, or launches a browser.",
    "live: drives a real Chrome; also `slow`. Skipped where none is installed.",
]

[tool.coverage.run]
source = ["src/dataporter"]

[tool.coverage.report]
# Measured by `make check-all`, which is the only command that passes `--cov` —
# so these numbers are reproducible by that command and not by `make check`.
# The suite's coverage at the time this gate was added: 1385/1409 statements,
# 98.3%. Raise it when the real number rises; never lower it to make a run pass.
# `09`: 3423/3450, 99.2%. `11`: 3497/3524, 99.2%. `12`: 3768/3795, 99.3%.
# `13`: 3858/3885, 99.3%. `14`: 4081/4108, 99.3%. `15`: 4223/4250, 99.4%.
# `17`: 4642/4669, 99.4%. `18`: 4782/4810, 99.4%. `19`: 4959/4986, 99.5%.
# `20`: 5348/5382, 99.4%.
fail_under = 99
show_missing = true
